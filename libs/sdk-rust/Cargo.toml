[package]
name = "daytona-sdk"
version = "0.1.0"
edition = "2021"
description = "Daytona SDK for Rust"
license = "Apache-2.0"

[dependencies]
daytona-api-client = { path = "../api-client-rust" }
daytona-toolbox-client = { path = "../toolbox-api-client-rust" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "multipart", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest-middleware = { version = "0.5", features = ["json", "multipart", "form", "query"] }
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
dotenvy = "0.15"
